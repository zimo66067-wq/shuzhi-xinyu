name: Experiment PostgreSQL Compatibility (branch only)

on:
  push:
    branches:
      - feat/neon-experiment-postgres
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-store-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xinyu_ci
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: xinyu_automated_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xinyu_ci -d xinyu_automated_only"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PG_TEST_DATABASE_URL: postgresql://xinyu_ci:ci-disposable-password@localhost:5432/xinyu_automated_only
      PG_TEST_ALLOW_WRITES: ci-only
      DEEPSEEK_API_KEY: ci-placeholder-not-real
      EXPERIMENT_ENABLED: "0"
      EXPERIMENT_ENV: automated
      PARENT_PASSWORD: ci-only-password
      PARENT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install application and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile all Python source
        working-directory: backend
        run: python -m compileall -q experiment tests
      - name: Run SQLite regression and PostgreSQL integrity tests
        working-directory: backend
        run: pytest -q tests/test_experiment.py tests/test_experiment_postgres.py
